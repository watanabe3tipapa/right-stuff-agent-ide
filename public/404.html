<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1117">
<title>ページが見つかりません — Right-Stuff Agent IDE</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --ink: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #d2a8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background:
      radial-gradient(60rem 30rem at 20% -10%, #1f6feb22, transparent 70%),
      radial-gradient(50rem 26rem at 90% 10%, #d2a8ff1a, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  }
  main {
    width: min(36rem, 100%);
    padding: 2.5rem;
    border: 1px solid var(--border);
    border-radius: 1rem;
    background: color-mix(in oklab, var(--surface) 88%, transparent);
    box-shadow: 0 24px 80px -32px #000;
  }
  .code {
    margin: 0 0 1rem;
    color: var(--accent);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
  }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    line-height: 1.25;
  }
  p {
    margin: 0 0 1.75rem;
    color: var(--muted);
    line-height: 1.8;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  a {
    display: inline-block;
    padding: 0.7rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 0.55rem;
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    transition: border-color 120ms ease, transform 120ms ease;
  }
  a:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; }
  a.primary:hover { background: #79b8ff; }
  footer {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <p class="code">404 — NOT FOUND</p>
  <h1>ページが見つかりません</h1>
  <p>URL が変更されたか、ページが削除された可能性があります。ランディングページまたはブラウザデモから目的のページを探してください。</p>
  <div class="links">
    <a class="primary" href="/">ランディングページ</a>
    <a href="/app/">ブラウザデモ</a>
    <a href="https://github.com/watanabe3tipapa/right-stuff-agent-ide">GitHub</a>
  </div>
  <footer>Right-Stuff Agent IDE — Sample Project — MIT License</footer>
</main>
</body>
</html>
