name: 機能要望
description: 新機能や改善の提案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。解決したい課題と、実現したい体験を記載してください。
        実装可否や時期は、設計方針とメンテナンス状況を踏まえて判断します。

  - type: checkboxes
    id: precondition
    attributes:
      label: 確認事項
      options:
        - label: 同じ内容の Issue や提案が既にないことを確認しました
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現在の何が不便か、どのような場面で困るかを記載してください
      placeholder: "例: 複数ファイルをまたぐ検索ができず、ワークスペース内の用語を探すのに時間がかかる"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: 具体的な機能、UI、操作方法など
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他のアプローチや、現状の回避方法
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 関連する領域
      options:
        - エディタ / ワークスペース
        - エージェント / 計画 / 承認
        - Git
        - ターミナル
        - LLM 接続 / 設定
        - Openship / デプロイ
        - 履歴 / 監査
        - ブラウザデモ / LP
        - ドキュメント / 配布
        - その他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 参考リンク、類似プロダクト、優先度の理由など
    validations:
      required: false
