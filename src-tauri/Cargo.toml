[package]
name = "right-stuff-agent-ide"
version = "0.3.0"
description = "Agent-driven IDE built on Right-Stuff Editor and Agent Desktop"
authors = ["watanabe3tipapa"]
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "right_stuff_agent_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
portable-pty = "0.9"

# The app is macOS-only, so only the Keychain backend is built.
keyring = { version = "3.6.3", features = ["apple-native"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
